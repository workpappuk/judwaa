services:
  postgres:
    container_name: judwaa-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=judwaa
      - POSTGRES_USER=judwaa
      - POSTGRES_PASSWORD=judwaa123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judwaa -d judwaa"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: judwaa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/judwaa
      - SPRING_DATASOURCE_USERNAME=judwaa
      - SPRING_DATASOURCE_PASSWORD=judwaa123
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1536m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:+ExitOnOutOfMemoryError
    working_dir: /app/backend
    volumes:
      - ./extras:/app/extras
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: judwaa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_BASE_URL=http://backend:8080
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
